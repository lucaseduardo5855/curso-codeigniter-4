<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CigBurguer BackOffice</title>
    <!--Boostrap css-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!--app.css-->
    <link rel="stylesheet" href="app.css" />
    <!--fontawesome-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <!--fontawesome cdn-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    />
    <!--favicon-->
    <link rel="shortcut icon" href="logo.png" type="image/png" />
  </head>
  <body>

    <!--Top bar-->
    <header class="top-bar d-flex justify-content-between align-items-center">
      <div class="d-flex">
        <div class="btn-main-menu me-3"><i class="fa-solid fa-bars"></i></div>
        <img src="logo.png" alt="Logo CigBurguer BackOffice" class="img-fluid" width="48px">
      </div>

      <div>
        <i class="fa-solid fa-user me-2"></i>username@gmail.com
        <i class="fa-solid fa-ellipsis-vertical mx-2"></i>
        <a href="#"><i class="fa-solid fa-right-from-bracket ME-2"></i>Sair</a>
        <!-- user / logout -->
      </div>
    </header>

    <!--Main-->
    <section>[conteudo]</section>

    <!--Footer-->
    <footer>[conteudo]</footer>

    <!--Boostrap js-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
